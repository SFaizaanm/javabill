spring.application.name=electricity-bill-calculator
server.port=8080

# Override these values with environment variables on Windows or in VS Code.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/electricity_bill_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

logging.level.org.springframework.web=INFO
logging.level.com.electricity=INFO
