spring.application.name=ELECTRICITY-BILL-CALCULATOR
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/electricity_bill_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

logging.level.org.springframework.web=INFO
logging.level.com.electricity=DEBUG
