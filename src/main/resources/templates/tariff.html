<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:text="${title}">Tariff Slabs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="section-title mb-0">Tariff Structure</h2>
        <a href="/" class="btn btn-outline-primary">Back Home</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Slab Name</th>
                        <th>Lower Limit</th>
                        <th>Upper Limit</th>
                        <th>Rate per Unit</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="slab : ${tariffs}">
                        <td th:text="${slab.slabName}"></td>
                        <td th:text="${slab.lowerLimit} + ' units'"></td>
                        <td th:text="${slab.upperLimit} + ' units'"></td>
                        <td th:text="'₹' + ${slab.rate} + ' / unit'"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
