<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Bill Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container py-5">
    <div class="card shadow-lg rounded-4 border-0">
        <div class="card-body p-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="section-title mb-0">Electricity Bill Calculation</h2>
                <a href="/" class="btn btn-outline-primary">Home</a>
            </div>

            <div class="row g-4">
                <div class="col-lg-6">
                    <h5>Consumer Details</h5>
                    <ul class="list-group">
                        <li class="list-group-item"><strong>Consumer ID:</strong> <span th:text="${consumer.consumerId}"></span></li>
                        <li class="list-group-item"><strong>Name:</strong> <span th:text="${consumer.name}"></span></li>
                        <li class="list-group-item"><strong>Previous Reading:</strong> <span th:text="${previousReading}"></span></li>
                        <li class="list-group-item"><strong>Current Reading:</strong> <span th:text="${currentReading}"></span></li>
                    </ul>
                </div>
                <div class="col-lg-6">
                    <h5>Bill Summary</h5>
                    <ul class="list-group">
                        <li class="list-group-item"><strong>Units Consumed:</strong> <span th:text="${result.unitsConsumed}"></span></li>
                        <li class="list-group-item"><strong>Energy Charge:</strong> ₹<span th:text="${result.energyCharge}"></span></li>
                        <li class="list-group-item"><strong>Fixed Charge:</strong> ₹<span th:text="${result.fixedCharge}"></span></li>
                        <li class="list-group-item"><strong>Additional Charges:</strong> ₹<span th:text="${result.additionalCharges}"></span></li>
                        <li class="list-group-item"><strong>Total Payable:</strong> ₹<span class="fw-bold text-success" th:text="${result.totalAmount}"></span></li>
                    </ul>
                </div>
            </div>

            <div class="mt-4">
                <h5>Slab-wise Charges</h5>
                <table class="table table-bordered mt-3">
                    <thead class="table-light">
                    <tr>
                        <th>Slab</th>
                        <th>Units</th>
                        <th>Rate</th>
                        <th>Amount</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="slab : ${result.slabCharges}">
                        <td th:text="${slab.slabName}"></td>
                        <td th:text="${slab.units}"></td>
                        <td th:text="${slab.rate}"></td>
                        <td th:text="${slab.amount}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <form action="/bills/generate" method="post" class="mt-4">
                <input type="hidden" name="consumerId" th:value="${consumer.consumerId}">
                <input type="hidden" name="previousReading" th:value="${previousReading}">
                <input type="hidden" name="currentReading" th:value="${currentReading}">
                <button type="submit" class="btn btn-success btn-lg">Generate Bill</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
