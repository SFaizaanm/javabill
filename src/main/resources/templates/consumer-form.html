<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Consumer Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="section-title mb-0" th:text="${consumer.id == null ? 'Register Consumer' : 'Update Consumer'}">Register Consumer</h2>
                        <a href="/consumers" class="btn btn-outline-secondary">Back</a>
                    </div>

                    <form th:action="${consumer.id == null ? '/consumers/save' : '/consumers/update/' + consumer.id}" method="post" th:object="${consumer}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Consumer ID</label>
                                <input type="text" class="form-control" th:field="*{consumerId}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Consumer Name</label>
                                <input type="text" class="form-control" th:field="*{name}" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Address</label>
                                <textarea class="form-control" th:field="*{address}" rows="3" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Mobile Number</label>
                                <input type="text" class="form-control" th:field="*{mobileNumber}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Consumer Category</label>
                                <select class="form-select" th:field="*{category}" required>
                                    <option value="">Select Category</option>
                                    <option value="Domestic">Domestic</option>
                                    <option value="Commercial">Commercial</option>
                                    <option value="Industrial">Industrial</option>
                                    <option value="Agricultural">Agricultural</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-4 d-flex gap-2 justify-content-end">
                            <button type="submit" class="btn btn-primary px-4" th:text="${consumer.id == null ? 'Register' : 'Update'}">Register</button>
                            <a href="/consumers" class="btn btn-outline-secondary px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
