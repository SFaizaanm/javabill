<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Bill Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <h2 class="section-title mb-4">Calculate Electricity Bill</h2>
                    <form action="/calculate" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Consumer ID</label>
                                <input type="text" class="form-control" name="consumerId" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Consumer Name</label>
                                <input type="text" class="form-control" name="consumerName" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Previous Meter Reading</label>
                                <input type="number" class="form-control" name="previousReading" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Current Meter Reading</label>
                                <input type="number" class="form-control" name="currentReading" min="0" required>
                            </div>
                        </div>
                        <div class="mt-4 d-flex justify-content-between">
                            <a href="/" class="btn btn-outline-secondary">Back Home</a>
                            <button type="submit" class="btn btn-primary px-4">Calculate</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
