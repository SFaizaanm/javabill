<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">ELECTRICITY BILL CALCULATOR</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/consumers}">Consumers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/tariff}">Tariff</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/calculate}">Calculate Bill</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bills}">Bill History</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-3">
    <div th:if="${successMessage != null}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}"></div>
</div>
</body>
</html>
