<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container py-5">
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="dashboard-card primary">
                <div class="label">Total Consumers</div>
                <div class="value" th:text="${summary.totalConsumers}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card success">
                <div class="label">Bills Generated</div>
                <div class="value" th:text="${summary.totalBills}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card warning">
                <div class="label">Total Units</div>
                <div class="value" th:text="${summary.totalUnitsConsumed}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card danger">
                <div class="label">Billing Amount</div>
                <div class="value" th:text="'₹' + ${summary.totalBillingAmount}">₹0.00</div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h4 class="mb-0">Recent Billing Records</h4>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Bill Number</th>
                        <th>Consumer ID</th>
                        <th>Consumer</th>
                        <th>Total</th>
                        <th>Date</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="bill : ${summary.recentBills}">
                        <td><a th:href="@{/bills/{id}(id=${bill.id})}" th:text="${bill.billNumber}"></a></td>
                        <td th:text="${bill.consumerId}"></td>
                        <td th:text="${bill.consumerName}"></td>
                        <td th:text="${bill.totalAmount}"></td>
                        <td th:text="${#temporals.format(bill.billingDate, 'yyyy-MM-dd')}" ></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
