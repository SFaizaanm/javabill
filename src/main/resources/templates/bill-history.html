<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Bill History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="section-title mb-0">Bill History</h2>
        <form action="/bills" method="get" class="d-flex gap-2">
            <input type="text" class="form-control" name="consumerId" placeholder="Search by Consumer ID" th:value="${consumerId}">
            <button class="btn btn-primary" type="submit">Search</button>
        </form>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Bill Number</th>
                        <th>Consumer ID</th>
                        <th>Consumer Name</th>
                        <th>Units</th>
                        <th>Total Amount</th>
                        <th>Date</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="bill : ${bills}">
                        <td><a th:href="@{/bills/{id}(id=${bill.id})}" th:text="${bill.billNumber}"></a></td>
                        <td th:text="${bill.consumerId}"></td>
                        <td th:text="${bill.consumerName}"></td>
                        <td th:text="${bill.unitsConsumed}"></td>
                        <td th:text="'₹' + ${bill.totalAmount}"></td>
                        <td th:text="${#temporals.format(bill.billingDate, 'yyyy-MM-dd')}" ></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
