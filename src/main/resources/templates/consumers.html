<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Consumers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">ELECTRICITY BILL CALCULATOR</a>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="section-title mb-0">Consumer Management</h2>
        <a href="/consumers/new" class="btn btn-primary">Add Consumer</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Consumer ID</th>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Mobile</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="consumer : ${consumers}">
                        <td th:text="${consumer.consumerId}"></td>
                        <td th:text="${consumer.name}"></td>
                        <td th:text="${consumer.address}"></td>
                        <td th:text="${consumer.mobileNumber}"></td>
                        <td th:text="${consumer.category}"></td>
                        <td>
                            <a th:href="@{/consumers/edit/{id}(id=${consumer.id})}" class="btn btn-sm btn-warning">Edit</a>
                            <a th:href="@{/consumers/delete/{id}(id=${consumer.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this consumer?')">Delete</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
